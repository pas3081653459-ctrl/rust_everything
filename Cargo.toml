[package]
name = "rust-everything"
version = "0.1.0"
edition = "2024"
description = "A fast, local file-name search tool for macOS"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossbeam-channel = "0.5"
directories = "6"
eframe = "0.35"
global-hotkey = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["tiff"] }
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSImage", "NSPasteboard", "NSResponder", "NSView", "NSWindow", "NSWorkspace"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFString"] }
objc2-core-services = { version = "0.3.2", default-features = false, features = ["std", "FSEvents", "dispatch2", "libc"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSFileManager", "NSGeometry", "NSObject", "NSString", "NSURL"] }
dispatch2 = { version = "0.3.0", features = ["alloc"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
[package.metadata.bundle]
name = "Rust Everything"
identifier = "dev.rusteverything.app"
version = "0.1.0"
category = "public.app-category.utilities"
short_description = "Fast filename and path search for macOS"
long_description = """
A resident macOS filename and path search application written in Rust.
"""
icon = ["assets/RustEverything.pgn"]
